name: Windows program

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "Data-Finder.exe"
      - "Data-Finder-Setup.exe"
      - "release/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: npm ci
      - name: Build setup and program
        run: npx --yes @tauri-apps/cli@2.12.3 build
      - name: Collect the two files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$PWD/windows-out" | Out-Null
          $setup = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Setup file was not created" }
          Copy-Item $setup.FullName "$PWD/windows-out/Data Finder Setup.exe"
          $portable = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" | Where-Object { $_.Name -notlike "*setup*" } | Select-Object -First 1
          if (-not $portable) { throw "Program was not created" }
          Copy-Item $portable.FullName "$PWD/windows-out/Data Finder.exe"
          Copy-Item "$PWD/windows-out/Data Finder Setup.exe" "$PWD/windows-out/Data-Finder-Setup.exe"
          Copy-Item "$PWD/windows-out/Data Finder.exe" "$PWD/windows-out/Data-Finder.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Data-Finder-Windows
          path: windows-out/*
          if-no-files-found: error
      - name: Publish this version and keep older ones
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content -Raw "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $tag = "v$version"
          $notes = "Data Finder $version. Older versions stay on the releases page."
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "windows-out/Data-Finder-Setup.exe" "windows-out/Data-Finder.exe" --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --latest --title "Data Finder $version" --notes $notes
          } else {
            gh release create $tag `
              "windows-out/Data-Finder-Setup.exe" `
              "windows-out/Data-Finder.exe" `
              --title "Data Finder $version" `
              --notes $notes `
              --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Put the program files in the repo
        shell: pwsh
        run: |
          Copy-Item "windows-out/Data-Finder-Setup.exe" "Data-Finder-Setup.exe" -Force
          Copy-Item "windows-out/Data-Finder.exe" "Data-Finder.exe" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Data-Finder-Setup.exe" "Data-Finder.exe"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Update the Windows program files"
          git push origin HEAD:main
