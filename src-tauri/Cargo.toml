[package]
name = "data-finder"
version = "0.2.21"
edition = "2021"
description = "Data Finder desktop"
license = "LicenseRef-AllRightsReserved"

[lib]
name = "data_finder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
drag = "2.1.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
