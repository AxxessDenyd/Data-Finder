[[permission]]
identifier = "allow-disk"
description = "Read and change files on this computer"
commands.allow = [
  "drives",
  "list_dir",
  "create_item",
  "rename_path",
  "remove_path",
  "read_text",
  "copy_item",
  "move_item",
  "measure_children",
  "unmount_drive",
  "mount_image",
  "format_drive",
  "mount_volume",
  "map_network",
  "open_url",
  "known_folders",
  "snapshot_save",
  "snapshot_list",
  "snapshot_restore",
  "snapshot_remove",
]
